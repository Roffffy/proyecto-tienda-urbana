spring.application.name=notificaciones
server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/bd_notificaciones
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.com.proyecto.ms_notificaciones=debug
logging.level.org.springframework=warn
logging.level.org.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

logging.pattern.console=%d{yyyy-mm-dd hh:mm:ss} [5level] %logger{30} -%msg%n

logging.file.name=logs/ms-notificaciones.log
logging.logback.rollingpolicy.max-file-size=10mb
logging.logback.rollingpolicy.max-history=7

springdoc.api-docs.enabled=true
# http://localhost:8088/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
