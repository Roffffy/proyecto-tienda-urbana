spring.application.name=ordenes
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/db_ordenes_tienda_urbana
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true

logging.level.com.tienda_urbana.ordenes=debug
logging.level.org.springframework=warn
logging.level.org.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

logging.file.name=logs/ordenes.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

springdoc.api-docs.enabled=true
# http://localhost:8083/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

ms.carritos.url=localhost:8083

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=127.0.0.1:${spring.application.name}:${server.port}