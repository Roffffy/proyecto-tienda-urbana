spring.application.name=catalogo
server.port=8082

spring.datasource.url=jdbc:mysql://mysql:3306/db_catalogo_tienda_urbana
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true

logging.level.com.tienda_urbana.catalogo=debug
logging.level.org.springframework=warn
logging.level.org.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

logging.file.name=logs/catalogo.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7


springdoc.api-docs.enabled=true
# http://localhost:8082/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=catalogo
eureka.instance.instance-id=catalogo:${server.port}