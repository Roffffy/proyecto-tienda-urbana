spring.application.name=resena
server.port=8085

spring.datasource.url=jdbc:mysql://mysql:3306/bd_resena
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.com.proyecto.ms_resena=debug
logging.level.org.springframework=warn
logging.level.org.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

logging.pattern.console=%d{yyyy-mm-dd hh:mm:ss} [5level] %logger{30} - %msg%n

logging.file.name=logs/ms-resena.log
logging.logback.rollingpolicy.max-file-size=10mb
logging.logback.rollingpolicy.max-history=7

springdoc.api-docs.enabled=true
# http://localhost:8085/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=resena
eureka.instance.instance-id=resena:${server.port}